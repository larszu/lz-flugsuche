[project]
name = "lz-flugsuche"
version = "0.2.0"
description = "Günstigste Flüge ab allen Flughäfen in der Umgebung – auch zu Land, Kontinent oder überallhin"
requires-python = ">=3.11"
dependencies = [
  "flights>=0.9",
  "fastapi>=0.110",
  "uvicorn>=0.29",
  "httpx>=0.27",
]

[project.optional-dependencies]
test = ["pytest>=8"]
build = ["pyinstaller>=6.10", "pip-licenses>=5"]

[project.scripts]
lzflug = "lzflug.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["lzflug", "lzflug.sources"]

[tool.setuptools.package-data]
lzflug = ["static/*", "data/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
